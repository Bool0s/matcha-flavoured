name: Create Nightly Release

on:
  schedule:
    - cron: '25 4 * * *'
  workflow-dispatch:

jobs:
  nightly:
    if: ${{ github.repository == 'kleiwright/matcha-flavoured' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Zip MF_resourcepack contents
        run: |
          cd MF_resourcepack
          zip -r ../MF_resourcepack.zip .

      - name: Zip MF_datapack contents
        run: |
          cd MF_datapack
          zip -r ../MF_datapack.zip .

      - name: Create Release Description
        run: |
          echo "This is an experimental release with the latest features and bugfixes. Last updated: " >> nightly.txt
          date -u >> nightly.txt

      - name: Create Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          name: Nightly Release
          body: This is an experimental release with the latest features and bugfixes.
          body_path: nightly.txt
          prerelease: true
          files: |
            MF_resourcepack.zip
            MF_datapack.zip
